<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DjangoBlog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3 justify-content-start">
    <a class="navbar-brand me-4" href="{% url 'home' %}">DjangoBlog</a>
    <div class="navbar-nav d-flex flex-row gap-3">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
            <a class="nav-link" href="{% url 'about' %}">About</a>
            <a class="nav-link" href="{% url 'contact' %}">Contact</a>
        </div>
    </nav> 
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
