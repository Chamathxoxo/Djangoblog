<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DjangoBlog{% endblock %}</title>

    {% load static %}
    <link rel="icon" type="image/jpeg" href="{% static 'blog/css/Heart.jpg' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3 justify-content-start">
        <a class="navbar-brand me-4 d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'blog/css/Crown.jpg' %}" alt="DjangoBlog Logo" width="30" height="30" class="d-inline-block align-text-top rounded-circle object-fit-cover">
            <span>DjangoBlog</span>
        </a>
        <div class="navbar-nav d-flex flex-row gap-3">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
            <a class="nav-link" href="{% url 'about' %}">About</a>
            <a class="nav-link" href="{% url 'contact' %}">Contact</a>
        </div>
        <a class="btn btn-outline-light btn-sm ms-auto" href="{% url 'post_create' %}">New Post</a>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-4 mt-5" style="background:#212529; color:#aaa;">
        <p class="mb-1">&copy; 2026 DjangoBlog. All rights reserved.</p>
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const nav = document.querySelector(".navbar");
            if (window.scrollY > 20) {
                nav.classList.add("scrolled");
            } else {
                nav.classList.remove("scrolled");
            }
        });
    </script>
</body>
</html>
