{% extends "blog/base.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<div class="post-form-wrapper">
  <div class="post-form-card auth-card">
    <h1 class="post-form-title text-center">Set a new password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 mt-3">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
